name: Test services db, api, web

on:
  pull_request:
    paths:
      - 'frontend/**'
    branches:
      - 'main'
  push:
    branches:
      - 'main'
    paths:
      - 'frontend/**'
    tags:
      - "*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'true'

      - name: Set env
        run: cp .env.example .env

      - name: Pull Docker images
        run: docker compose -f docker-compose.dev.yml -f docker-compose.yml pull db api web_tests

      - name: Build Docker images
        run: |
          set -eu
          source .env
          docker compose -f docker-compose.dev.yml -f docker-compose.yml build web_dev
          docker compose -f docker-compose.dev.yml -f docker-compose.yml build web

      - name: Run PostgSail Web tests
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: signalk
          PGUSER: username
          PGPASSWORD: password
        run: |
          set -eu
          source .env
          docker compose stop || true
          docker compose rm || true
          docker compose up -d db
          until docker compose exec -T db pg_isready -U username; do echo "Waiting for db..."; sleep 3; done
          docker compose up migrate
          docker compose ps -a
          echo "Test PostgSail Web Unit Test"
          docker compose -f docker-compose.dev.yml -f docker-compose.yml up -d web_dev
          timeout 120 bash -c 'until curl -sf http://localhost:8080/; do echo "Waiting for web..."; sleep 5; done'
          docker compose -f docker-compose.dev.yml -f docker-compose.yml logs web_dev
          docker compose ps -a
          docker compose -f docker-compose.dev.yml -f docker-compose.yml up web_tests --abort-on-container-exit --exit-code-from web_tests

      - name: Show the logs
        if: always()
        run: |
          docker compose logs
