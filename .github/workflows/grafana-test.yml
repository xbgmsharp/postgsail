name: Test services db, grafana

on:
  pull_request:
    paths:
      - 'grafana/**'
    branches:
      - 'main'
  push:
    branches:
      - 'main'
    paths:
      - 'grafana/**'
    tags:
      - "*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set env
        run: cp .env.example .env

      - name: Pull Docker images
        run: docker compose pull db app

      - name: Run PostgSail Grafana test
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: signalk
          PGUSER: username
          PGPASSWORD: password
        run: |
          set -eu
          source .env
          docker compose stop || true
          docker compose rm || true
          docker compose up -d db
          until docker compose exec -T db pg_isready -U username; do echo "Waiting for db..."; sleep 3; done
          docker compose up migrate
          docker compose up -d api
          timeout 30 bash -c 'until curl -sf http://localhost:3000/; do sleep 3; done'
          docker compose ps -a
          echo "Test PostgSail Grafana Unit Test"
          docker compose up -d app
          timeout 30 bash -c 'until curl -sf http://localhost:3001/; do sleep 3; done'
          docker compose ps -a
          curl http://localhost:3001/
          docker compose exec -i db psql -Uusername signalk -c "select public.cron_process_grafana_fn();"

      - name: Show the logs
        if: always()
        run: |
          docker compose logs
