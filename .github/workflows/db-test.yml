name: Test services db, api

on:
  pull_request:
    paths:
      - 'initdb/**'
      - 'tests/**'
      - 'db/**'
    branches:
      - 'main'
  push:
    branches:
      - 'main'
    paths:
      - 'initdb/**'
      - 'tests/**'
      - 'db/**'
    tags:
        - "*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoketest:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v7

      - name: Set env
        run: cp .env.example .env

      - name: Pull Docker images
        run: docker compose pull db api

      - name: Build Docker images
        run: docker compose -f docker-compose.dev.yml -f docker-compose.yml build tests

      - name: Install psql
        run: sudo apt install postgresql-client

      - name: Run PostgSail Database & API tests
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: signalk
          PGUSER: username
          PGPASSWORD: password
        run: |
          set -eu
          source .env
          docker compose stop || true
          docker compose rm || true
          docker compose up -d db
          until docker compose exec -T db pg_isready -U ${PGUSER}; do echo "Waiting for db..."; sleep 5; done
          docker compose up migrate
          docker compose up -d api
          timeout 30 bash -c 'until curl -sf http://localhost:3000/; do sleep 5; done'
          docker compose ps -a
          echo ${PGSAIL_API_URL}
          curl ${PGSAIL_API_URL}
          psql -c "select 1"
          echo "Disable cron job"
          docker compose exec -i db psql postgres -c "UPDATE cron.job SET active = False;"
          echo "Test PostgreSQL version"
          psql -c "SELECT version();"
          echo "Test PostgSail version"
          psql -c "SELECT value FROM app_settings WHERE name = 'app.version';"
          echo "Test PostgSail Unit Test"
          docker compose -f docker-compose.dev.yml -f docker-compose.yml up tests --abort-on-container-exit --exit-code-from tests

      - name: Show the logs
        if: always()
        run: |
          docker compose logs
